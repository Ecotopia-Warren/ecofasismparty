website:
  title: "ECOTOPIA"
  description: "Crew & print hub for Ecotopia: one night in the last sustainable utopia. Spoilers."
  favicon: "assets/favicon.ico"
  navbar:
    background: "#0a140a"
    foreground: "#4aad4a"
    logo: "assets/logo.svg"
    title: "ECOTOPIA"
    left:
      - text: "HOME"
        href: index.qmd
      - text: "THE WORLD"
        href: lore.qmd
      - text: "10 MINISTRIES"
        href: manifesto.qmd
      - text: "SLOGANS & SONGS"
        href: slogans.qmd
      - text: "DOWNLOADS"
        href: downloads.qmd
      - text: "INTAKE"
        href: attend.qmd
      - text: "QUESTS & PACK"
        href: quest_cards_and_facilitator_pack.qmd
      - text: "AUDIO & SCRIPTS"
        href: broadcast_scripts_and_liturgy.qmd
      - text: "LORE BIBLE"
        href: lore_and_narrative_bible.qmd
      - text: "GAME DESIGN"
        href: game_design_and_activities.qmd
  page-footer:
    background: "#0a140a"
    foreground: "#2d7a2d"
    center: |
      "R.E.I.G.N. decides, so that citizens are free." · Crew & print hub, spoilers inside
  open-graph:
    title: "ECOTOPIA: ONE NIGHT IN THE LAST SUSTAINABLE UTOPIA"
    description: "Living green, living together, living for the future."

format:
  html:
    theme: [darkly, styles.css]
    toc: false
    mainfont: "Special Elite, monospace"
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
